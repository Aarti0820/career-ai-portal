<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI', 'Noto Color Emoji', sans-serif;
  background:#020617;
  color:white;
}

.navbar{
  padding:15px 30px;
  border-bottom:1px solid #1e293b;
}

.container{
  display:flex;
  gap:20px;
  padding:20px;
}

.jobs{
  width:75%;
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:20px;
}

.card{
  background:#1e293b;
  border-radius:12px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.content{
  padding:15px;
}

.desc{
  font-size:13px;
  color:#cbd5e1;
}

button{
  padding:8px 15px;
  border:none;
  border-radius:6px;
  background:#38bdf8;
  cursor:pointer;
}

.msg{
  max-width:70%;
  padding:10px 14px;
  border-radius:15px;
  margin:6px 0;
  font-size:14px;
  line-height:1.4;
}

.user{
  background:#4f46e5;
  align-self:flex-end;
  border-bottom-right-radius:3px;
}

.bot{
  background:#334155;
  align-self:flex-start;
  border-bottom-left-radius:3px;
}

#chat{
  display:flex;
  flex-direction:column;
  gap:5px;
}

/* AI */
.chat-section{
  width:25%;
}

.chat-box{
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  height:500px;
  display:flex;
  flex-direction:column;
}

#chat{
  flex:1;
  overflow-y:auto;
}

.input-area{
  display:flex;
  margin-top:10px;
}

.input-area input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
}

.pagination{
  text-align:center;
  margin:20px;
}
</style>
</head>

<body>

<div class="navbar">
  <h2>🚀 Dashboard</h2>
</div>

<div class="container">

  <!-- JOBS -->
  <div class="jobs" id="jobs"></div>

  <!-- AI -->
  <div class="chat-section">
    <div class="chat-box">
      <h3>AI Assistant 🤖</h3>

      <div id="chat"></div>

      <div class="input-area">
        <input id="query" placeholder="Ask something...">
        <button onclick="ask()">Send</button>
      </div>
    </div>
  </div>

</div>

<div class="pagination">
  <button onclick="prev()">⬅ Prev</button>
  <button onclick="next()">Next ➡</button>
</div>

<script>

let page = 0;

// LOAD JOBS
function loadJobs(){
 fetch(`/jobs?page=${page}&size=4`)
 .then(r=>r.json())
 .then(data=>{
  let h="";
  data.content.forEach(j=>{
    h+=`
    <div class="card">
      <img src="${j.imageUrl}">
      <div class="content">
        <h3>${j.title}</h3>
        <p>${j.company}</p>
        <p class="desc">${j.description || "No description"}</p>
        <button onclick="apply(${j.id})">Apply</button>
      </div>
    </div>`;
  });
  document.getElementById("jobs").innerHTML = h;
 });
}

// APPLY
function apply(id){
 fetch(`/apply?userId=1&jobId=${id}`,{method:"POST"})
 .then(r=>r.text())
 .then(alert);
}

// PAGINATION
function next(){
  page++;
  loadJobs();
}

function prev(){
  if(page>0){
    page--;
    loadJobs();
  }
}

// AI CHAT
function ask(){

  let q = document.getElementById("query").value;

  if(q.trim()===""){
    return;
  }

  // USER BUBBLE
  chat.innerHTML += `<div class="msg user">🧑 ${q}</div>`;

  // TYPING
  chat.innerHTML += `<div class="msg bot">🤖 typing...</div>`;

  scrollBottom();

  fetch(`/ai/suggest?skill=${q}`)
  .then(r=>r.text())
  .then(d=>{

    // remove typing
    let msgs = document.querySelectorAll(".bot");
    msgs[msgs.length-1].remove();

    // BOT BUBBLE
    chat.innerHTML += `<div class="msg bot">🤖 ${d}</div>`;

    scrollBottom();
  });

  document.getElementById("query").value="";
}

// SCROLL
function scrollBottom(){
  let box = document.getElementById("chat");
  box.scrollTop = box.scrollHeight;
}

// ENTER KEY
document.getElementById("query").addEventListener("keypress", function(e){
  if(e.key==="Enter"){
    ask();
  }
});

loadJobs();

</script>

</body>
</html>
