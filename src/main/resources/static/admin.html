<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>

body {
  margin:0;
  font-family:'Segoe UI';
  background:#020617;
  color:white;
}

/* NAVBAR SPACE */
#nav { margin-bottom:10px; }

/* LAYOUT */
.container {
  padding:20px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns: 1fr 2fr;
  gap:20px;
}

/* CARD */
.card {
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

/* FORM */
input, textarea {
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:6px;
}

button {
  padding:10px;
  background:#38bdf8;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover {
  background:#0ea5e9;
}

/* JOB TABLE */
table {
  width:100%;
  border-collapse:collapse;
}

th, td {
  padding:10px;
  text-align:left;
}

th {
  background:#0f172a;
}

tr:nth-child(even){
  background:#334155;
}

/* APPLICATIONS */
.app-box {
  margin-top:20px;
}

</style>

</head>

<body>

<!-- NAVBAR LOAD -->
<div id="nav"></div>

<script>
fetch("navbar.html")
.then(r=>r.text())
.then(d=> document.getElementById("nav").innerHTML=d);
</script>

<div class="container">

  <h2>Admin Dashboard ⚙️</h2>

  <div class="grid">

    <!-- ADD JOB -->
    <div class="card">

      <h3>Add Job</h3>

      <input id="title" placeholder="Job Title">
      <input id="company" placeholder="Company">
      <input id="location" placeholder="Location">
      <input id="salary" placeholder="Salary">
      <input id="imageUrl" placeholder="Image URL">
      <textarea id="desc" placeholder="Description"></textarea>

      <button onclick="addJob()">Add Job</button>

    </div>

    <!-- JOB LIST -->
    <div class="card">

      <h3>Job List</h3>

      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Company</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="jobTable"></tbody>

      </table>

    </div>

  </div>

  <!-- APPLICATIONS -->
  <div class="card app-box">

    <h3>Applications 📄</h3>

    <div id="apps"></div>

  </div>

</div>

<script>
	function addJob(){

	 fetch("/jobs",{
	  method:"POST",
	  headers:{"Content-Type":"application/json"},
	  body: JSON.stringify({
	    title:title.value,
	    company:company.value,
	    location:location.value,
	    salary:salary.value,
	    imageUrl:imageUrl.value,
	    description:desc.value   // 🔥 FIX
	  })
	 })
	 .then(r=>r.text())
	 .then(msg=>{
	   alert(msg);
	   loadJobs();
	 });
	}

	function loadJobs(){

	 fetch("/jobs")
	 .then(r=>r.json())
	 .then(data=>{

	  let h="";

	  data.content.forEach(j=>{
	    h+=`
	    <tr>
	      <td>${j.title}</td>
	      <td>${j.company}</td>
	      <td><button onclick="del(${j.id})">Delete</button></td>
	    </tr>`;
	  });

	  jobTable.innerHTML=h;

	 });
	}
	
	
	function del(id){

		  if(confirm("Are you sure you want to delete?")){

		    fetch(`/jobs/${id}`, {
		      method: "DELETE"
		    })
		    .then(res => res.text())
		    .then(msg => {
		      alert(msg);
		      loadJobs(); // 🔥 table refresh
		    })
		    .catch(err => {
		      alert("Delete failed 😅");
		      console.error(err);
		    });

		  }

		}
	
	function loadApplications(){

		 fetch("/applications/details")
		 .then(r=>r.json())
		 .then(data=>{

		  let h = `
		  <table>
		    <tr>
		      <th>User Name</th>
		      <th>Job Title</th>
		    </tr>`;

		  data.forEach(a=>{
		    h += `
		    <tr>
		      <td>${a.userName}</td>
		      <td>${a.jobTitle}</td>
		    </tr>`;
		  });

		  h += `</table>`;

		  document.getElementById("apps").innerHTML = h;

		 });
		}
	
	
	window.onload = function(){
		  loadJobs();   // 🔥 page load pe hi jobs show
		  loadApplications(); // 🔥 applications bhi load
		}
</script>

</body>
</html>
